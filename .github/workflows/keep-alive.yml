name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://onlah-api.onrender.com' }}
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/health"
