name: CI

# Deliberately no `paths:` filter. The apps read each other's files (the web tests read Docs/, CHANGELOG.md and
# .githooks/), so a change outside an app folder can still break that app. Every job runs on every change.
on:
  pull_request:
    branches: [main]
  # Also test main after a merge, since two PRs that passed alone can still break each other.
  push:
    branches: [main]

# Read-only token. If a job ever needs more (commenting on a PR, uploading results), grant that scope on that job.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Runs on main are never cancelled, and each commit on main
# gets its own group so that a quick second merge cannot drop the first merge's run from the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OnLah.sln
      - run: dotnet build OnLah.sln --no-restore -c Release
      - run: dotnet test OnLah.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_API_BASE_URL: http://localhost:5050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run check
