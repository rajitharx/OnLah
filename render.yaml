services:
  - type: web
    name: onlah-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: Lta__AccountKey
        sync: false
      - key: Admin__ApiKey
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Rate limiting stays off (RateLimiting__Enabled unset) until the client IP is confirmed on Render.
      # Follow "Client IPs and rate limiting" in DEPLOYMENT.md before turning it on.
